<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haru 的靈魂占卜室</title>
    <style>
        :root { --main-bg: #f4f4f9; }
        body { font-family: 'PingFang TC', sans-serif; background-color: var(--main-bg); display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; transition: background 0.8s ease; }
        .card { background: white; padding: 2rem; border-radius: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); text-align: center; width: 95%; max-width: 550px; }
        .type-tag { font-size: 0.7rem; color: #aaa; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 10px; }
        h1 { color: #444; font-size: 1.5rem; margin: 10px 0; }
        
        .deck-area { display: flex; justify-content: center; gap: 10px; margin: 20px 0; flex-wrap: wrap; }
        .tarot-back { width: 70px; height: 110px; background: #333; border-radius: 10px; cursor: pointer; border: 2px solid white; box-shadow: 0 4px 8px rgba(0,0,0,0.2); display: flex; align-items: center; justify-content: center; color: white; font-size: 0.7rem; transition: 0.3s; }
        .tarot-back:hover { transform: translateY(-5px); background: #555; }

        .result-area { max-height: 400px; overflow-y: auto; padding-right: 5px; }
        .result-box { display: none; text-align: left; background: #fdfdfd; border-left: 5px solid #333; padding: 12px; border-radius: 0 12px 12px 0; margin-top: 10px; }
        .tarot-name { font-size: 1.1rem; font-weight: bold; color: #222; display: block; margin-bottom: 5px; }
        .tarot-mean { font-size: 0.9rem; color: #555; line-height: 1.5; }

        .btn-reset { background: #333; color: white; border: none; padding: 12px; border-radius: 12px; margin-top: 20px; cursor: pointer; display: none; width: 100%; font-weight: bold; }
        select { padding: 10px; border-radius: 10px; margin-bottom: 10px; width: 100%; font-size: 1rem; border: 1px solid #ddd; }
    </style>
</head>

    <div class="type-tag">Professional Tarot</div>
    <h1 id="header">請默想你的問題</h1>
    
    <div style="margin-bottom: 15px;">
        <select id="spreadCount">
            <option value="1">單張指引 (快速解答)</option>
            <option value="3">三張牌陣 (過去/現在/未來)</option>
            <option value="4">四張牌陣 (四大元素方位)</option>
            <option value="6">六張牌陣 (自我、關係與阻礙)</option>
            <option value="7">七張牌陣 (脈輪或完整週運勢)</option>
        </select>
    </div>

    <div id="deck" class="deck-area"></div>

        targetCount = parseInt(document.getElementById('spreadCount').value);
        drawnCount = 0;
        shuffledDeck = [...tarotDeck].sort(() => 0.5 - Math.random());
        
        document.getElementById('deck').innerHTML = "";
        document.getElementById('result-area').innerHTML = "";
        document.getElementById('reset-btn').style.display = "none";
        document.getElementById('hint').style.display = "block";
        document.getElementById('header').innerText = "請默想你的問題";
        document.body.style.backgroundColor = "#f4f4f9";

        let cardDisplayCount = Math.max(targetCount, 8); 
        for (let i = 0; i < cardDisplayCount; i++) {
            let card = document.createElement('div');
            card.className = "tarot-back";
            card.innerText = "靈魂卡";
            card.onclick = () => pickCard(card, i);
            document.getElementById('deck').appendChild(card);
        }
    }

    function pickCard(cardElement, index) {
        if (drawnCount >= targetCount) return;

        const card = shuffledDeck[index];
        const resultItem = document.createElement('div');
        resultItem.className = "result-box";
        resultItem.style.display = "block";
        
        let label = positionData[targetCount][drawnCount];

        document.getElementById('result-area').appendChild(resultItem);
        cardElement.style.visibility = "hidden";
        drawnCount++;

            document.getElementById('deck').innerHTML = "";
            document.getElementById('hint').style.display = "none";
            document.getElementById('header').innerText = "占卜結果已顯現";
            document.getElementById('reset-btn').style.display = "block";
        }
    }

    initDeck();
    document.getElementById('spreadCount').onchange = initDeck;

    function drawTarot() {
        const count = document.getElementById('spread').value;
        const resultArea = document.getElementById('result-list');
        resultArea.innerHTML = "";
        let shuffled = [...tarotDeck].sort(() => 0.5 - Math.random());
        let selected = shuffled.slice(0, parseInt(count));
        let posLabels = positions[count];
        selected.forEach((card, i) => {
            let item = document.createElement('div');
            item.className = "tarot-item";
            item.innerHTML = `<span class="pos-label">${posLabels[i]}</span><span class="tarot-name">${card.name}</span><span class="tarot-mean">${card.mean}</span>`;
            resultArea.appendChild(item);
        });
        document.body.style.backgroundColor = selected[0].color;
