<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Haru 的專業占卜室</title>
    <style>
        :root { --gold: #d4af37; --bg: #0a0a12; }
        * { box-sizing: border-box; }
        body { 
            font-family: 'PingFang TC', sans-serif; 
            background: var(--bg); 
            color: #fff; 
            margin: 0; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            min-height: 100vh;
            overflow-x: hidden;
            /* 背景圖設定 */
            background-image: linear-gradient(to bottom, rgba(10, 10, 18, 0.7), rgba(10, 10, 18, 0.8)), url('6602.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        
        .header-section { margin-top: 30px; margin-bottom: 10px; text-align: center; width: 100%; }
        h1 { color: var(--gold); font-size: 1.8rem; margin: 10px 0; text-shadow: 0 2px 10px rgba(0,0,0,0.8); }
        .instruction-text { font-size: 1rem; color: #fff; margin: 5px 0; line-height: 1.5; font-weight: bold; padding: 0 20px; text-shadow: 0 2px 5px rgba(0,0,0,0.9); }

        .control-panel { width: 100%; max-width: 400px; margin-bottom: 20px; text-align: center; padding: 0 15px; }
        select { 
            width: 100%; 
            background: rgba(26, 26, 46, 0.85);
            color: white; 
            border: 1px solid var(--gold); 
            padding: 12px; 
            border-radius: 10px; 
            font-size: 1rem;
            appearance: none;
            backdrop-filter: blur(8px);
        }

        /* 三排橫向滑動佈局 */
        .deck-container {
            width: 100vw;
            overflow-x: auto;
            display: grid;
            grid-template-rows: repeat(3, 135px); 
            grid-auto-flow: column;
            gap: 15px;
            padding: 20px;
            -webkit-overflow-scrolling: touch;
        }
        .deck-container::-webkit-scrollbar { display: none; }

        .tarot-card { 
            width: 85px; 
            height: 125px; 
            background: linear-gradient(135deg, rgba(26, 26, 46, 0.9) 0%, rgba(22, 33, 62, 0.9) 100%);
            border: 1.5px solid var(--gold); 
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            color: rgba(212, 175, 55, 0.5);
            box-shadow: 0 5px 15px rgba(0,0,0,0.6);
            transition: transform 0.2s;
            user-select: none;
            backdrop-filter: blur(3px);
        }
        .tarot-card:active { transform: scale(0.9); }
        .tarot-card.selected { opacity: 0.1; transform: scale(0.8); pointer-events: none; border-color: #444; }

        /* 結果顯示區 */
        .result-list { width: 100%; max-width: 400px; margin-top: 10px; padding: 15px; }
        .result-item { 
            background: rgba(22, 33, 62, 0.8); 
            border-left: 5px solid var(--gold); 
            padding: 18px; 
            border-radius: 10px; 
            margin-bottom: 15px; 
            animation: slideUp 0.5s ease-out;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        
        .pos-name { color: var(--gold); font-size: 0.85rem; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        .card-title { font-size: 1.2rem; font-weight: bold; margin: 8px 0; display: block; color: #fff; }
        .card-desc { font-size: 0.95rem; color: #eee; line-height: 1.6; }

        /* 底部聯繫區 - 更新文字內容 */
        .info-footer {
            margin: 25px 0;
            padding: 20px;
            background: rgba(10, 10, 18, 0.75);
            border: 1.5px solid var(--gold);
            border-radius: 15px;
            text-align: center;
            backdrop-filter: blur(15px);
            width: 90%;
            max-width: 380px;
        }
        .info-title { color: var(--gold); font-weight: bold; font-size: 1.2rem; margin-bottom: 10px; }
        .info-text { font-size: 1rem; color: #fff; line-height: 1.8; font-weight: 500; }

        .main-btn { 
            background: var(--gold); 
            color: #000; 
            border: none; 
            padding: 15px 45px; 
            border-radius: 35px; 
            font-weight: bold; 
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(212, 175, 55, 0.4);
            margin-bottom: 50px;
            transition: 0.3s;
        }
    </style>
</head>
<body>

<div class="header-section">
    <h1 id="status-text">Haru 的專業占卜</h1>
    <p id="sub-text" class="instruction-text">請默念三次問題，心中不能有雜念，憑直覺抽牌</p>
</div>

<div id="setup-view" class="control-panel">
    <select id="spreadType">
        <option value="1">單張指引 (快速解答)</option>
        <option value="3">三張牌陣 (過去 / 現在 / 未來)</option>
        <option value="4">四張牌陣 (四大元素方位)</option>
        <option value="6">六張牌陣 (問題核心與全面解析)</option>
        <option value="7">七張牌陣 (脈輪與完整週運勢)</option>
    </select>
    <div style="margin-top: 35px;">
        <button class="main-btn" onclick="handleShuffle()">開始洗牌</button>
    </div>
</div>

<div id="game-view" style="display:none; width: 100%;">
    <p style="text-align:center; font-size: 0.95rem; color: #fff; font-weight: bold; margin-bottom: 10px; text-shadow: 0 2px 4px #000;">👈 左右滑動牌組，挑選 <span id="need-count" style="color:var(--gold);"></span> 張牌 👉</p>
    <div class="deck-container" id="deck-display"></div>
</div>

<div id="result-display" class="result-list"></div>

<div id="footer-action" style="display:none; flex-direction: column; align-items: center; width: 100%;">
    <div class="info-footer">
        <div class="info-title">✨ 詳細解牌內容找 Haru ✨</div>
        <div class="info-text">
            詳細解牌需下單<br>
            付款方式：轉帳 / 街口支付
        </div>
    </div>
    <button class="main-btn" onclick="location.reload()">重新占卜</button>
</div>

<script>
    // 塔羅牌完整數據與邏輯
    const tarotData = [
        { n: "0 愚者", m: "新的冒險與開始，保持純真與勇氣。" },
        { n: "I 魔術師", m: "展現才華，萬事具備，發揮創意。" },
        { n: "II 女祭司", m: "直覺敏銳，內在智慧，靜觀其變。" },
        { n: "III 皇后", m: "生活富足豐盛，感受愛與美。" },
        { n: "IV 皇帝", m: "權威穩定，建立秩序與掌控。" },
        { n: "V 教皇", m: "尋求指引，遵循傳統智慧與規範。" },
        { n: "VI 戀人", m: "美好的選擇，情感的和諧聯繫。" },
        { n: "VII 戰車", m: "意志堅定，克服障礙邁向勝利。" },
        { n: "VIII 力量", m: "溫柔的力量能戰勝內心的恐懼。" },
        { n: "IX 隱士", m: "退回內心，尋找自我的真理。" },
        { n: "X 命運之輪", m: "時來運轉，新的契機即將出現。" },
        { n: "XI 正義", m: "公平誠實，做出理性的決定。" },
        { n: "XII 倒吊人", m: "換個角度思考，現在需要等待。" },
        { n: "XIII 死亡", m: "舊的結束，即將迎來新的蛻變。" },
        { n: "XIV 節制", m: "尋求平衡，融合不同的可能性。" },
        { n: "XV 魔鬼", m: "覺察慾望，打破自我束縛的枷鎖。" },
        { n: "XVI 高塔", m: "震撼的改變，摧毀後的重生。" },
        { n: "XVII 星星", m: "希望不滅，平靜與心靈的療癒。" },
        { n: "XVIII 月亮", m: "探索不安，潛意識的夢境指引。" },
        { n: "XIX 太陽", m: "光明燦爛，充滿喜悅與活力。" },
        { n: "XX 審判", m: "覺醒的時刻，做出關鍵的召喚。" },
        { n: "XXI 世界", m: "圓滿達成，生命旅程的里程碑。" }
    ];

    const suits = ["權杖", "聖杯", "寶劍", "錢幣"];
    suits.forEach(s => {
        for(let i=1; i<=10; i++) tarotData.push({n: s+i, m: "象徵"+s+"能量的階段性展現。"});
        ["侍者", "騎士", "皇后", "國王"].forEach(p => tarotData.push({n: s+p, m: "代表"+s+"特質的人物或行動。"}));
    });

    const posConfig = {
        "1": ["神聖指引"],
        "3": ["過去", "現在", "未來"],
        "4": ["風之元素", "火之元素", "水之元素", "土之元素"],
        "6": ["現狀核心", "外在干擾", "潛在機會", "過去基礎", "他人觀點", "最終導向"],
        "7": ["週一", "週二", "週三", "週四", "週五", "週六", "週日"]
    };

    let pickGoal = 0;
    let pickedNum = 0;
    let pool = [];

    function handleShuffle() {
        pickGoal = parseInt(document.getElementById('spreadType').value);
        document.getElementById('setup-view').style.display = 'none';
        const deck = document.getElementById('deck-display');
        deck.innerHTML = '';
        document.getElementById('game-view').style.display = 'block';

        for(let i=0; i<78; i++) {
            const c = document.createElement('div');
            c.className = 'tarot-card';
            c.innerText = 'TAROT';
            deck.appendChild(c);
        }

        document.getElementById('status-text').innerText = "啟示即將顯現";
        document.getElementById('need-count').innerText = pickGoal;
        initGame();
    }

    function initGame() {
        pool = [...tarotData].sort(() => Math.random() - 0.5);
        const cards = document.querySelectorAll('.tarot-card');
        cards.forEach((el, idx) => {
            el.onclick = () => {
                if(pickedNum < pickGoal && !el.classList.contains('selected')) {
                    el.classList.add('selected');
                    renderResult(pool[idx]);
                    pickedNum++;
                    document.getElementById('need-count').innerText = pickGoal - pickedNum;
                    
                    if(pickedNum === pickGoal) {
                        document.getElementById('game-view').style.display = 'none';
                        document.getElementById('status-text').innerText = "占卜完成";
                        document.getElementById('footer-action').style.display = 'flex';
                    }
                }
            };
        });
    }

    function renderResult(data) {
        const res = document.getElementById('result-display');
        const div = document.createElement('div');
        div.className = 'result-item';
        const label = posConfig[pickGoal][pickedNum];
        div.innerHTML = `<span class="pos-name">${label}</span><span class="card-title">${data.n}</span><p class="card-desc">${data.m}</p>`;
        res.appendChild(div);
    }
</script>
</body>
</html>
