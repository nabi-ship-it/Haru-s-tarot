<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Haru 的專業占卜室</title>
    <style>
        :root { --gold: #d4af37; --bg: #0a0a12; }
        * { box-sizing: border-box; }
        body { 
            font-family: 'PingFang TC', sans-serif; 
            background: var(--bg); 
            color: #fff; 
            margin: 0; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }
        
        .header-section { margin-bottom: 10px; text-align: center; width: 100%; }
        h1 { color: var(--gold); font-size: 1.4rem; margin: 10px 0; }
        p { font-size: 0.85rem; color: #aaa; margin: 5px 0; }

        .control-panel { width: 100%; max-width: 400px; margin-bottom: 15px; }
        select { 
            width: 100%; 
            background: #1a1a2e; 
            color: white; 
            border: 1px solid var(--gold); 
            padding: 12px; 
            border-radius: 10px; 
            font-size: 1rem;
            appearance: none;
        }

        /* --- 關鍵修正：三排橫向滑動佈局 --- */
        .deck-container {
            width: 100vw;
            overflow-x: auto;
            display: grid;
            /* 設定三列橫向高度，並讓內容不換行 */
            grid-template-rows: repeat(3, 130px); 
            grid-auto-flow: column; /* 強制先填滿行，再往右擴展 */
            gap: 12px;
            padding: 20px;
            -webkit-overflow-scrolling: touch;
        }
        .deck-container::-webkit-scrollbar { display: none; }

        .tarot-card { 
            width: 80px; 
            height: 120px; 
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border: 1.5px solid var(--gold); 
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            color: rgba(212, 175, 55, 0.4);
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: transform 0.2s;
            user-select: none;
        }
        .tarot-card:active { transform: scale(0.9); }
        .tarot-card.selected { opacity: 0.15; transform: scale(0.8); pointer-events: none; border-color: #444; }

        /* 結果區 */
        .result-list { width: 100%; max-width: 400px; margin-top: 10px; }
        .result-item { 
            background: #16213e; 
            border-left: 4px solid var(--gold); 
            padding: 15px; 
            border-radius: 8px; 
            margin-bottom: 12px; 
            animation: slideUp 0.4s ease-out;
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .pos-name { color: var(--gold); font-size: 0.75rem; font-weight: bold; }
        .card-title { font-size: 1.05rem; font-weight: bold; margin: 5px 0; display: block; }
        .card-desc { font-size: 0.85rem; color: #ccc; line-height: 1.4; }

        .main-btn { 
            background: var(--gold); 
            color: #000; 
            border: none; 
            padding: 14px 40px; 
            border-radius: 30px; 
            font-weight: bold; 
            font-size: 1rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="header-section">
    <h1 id="status-text">Haru 的靈魂占卜</h1>
    <p id="sub-text">請默想問題，啟動能量</p>
</div>

<div id="setup-view" class="control-panel">
    <select id="spreadType">
        <option value="1">單張指引</option>
        <option value="3">三張牌陣 (過去/現在/未來)</option>
        <option value="4">四張牌陣 (地火水風)</option>
        <option value="6">六張牌陣 (全方位解析)</option>
        <option value="7">七張牌陣 (週運勢解析)</option>
    </select>
    <div style="margin-top: 25px; text-align: center;">
        <button class="main-btn" onclick="handleShuffle()">開始洗牌</button>
    </div>
</div>

<div id="game-view" style="display:none; width: 100%;">
    <p style="text-align:center; font-size: 0.8rem;">👈 左右滑動選取 <span id="need-count" style="color:var(--gold); font-weight:bold;"></span> 張牌 👉</p>
    <div class="deck-container" id="deck-display"></div>
</div>

<div id="result-display" class="result-list"></div>

<div id="footer-action" style="display:none; margin: 20px 0; text-align: center;">
    <button class="main-btn" onclick="location.reload()">重新占卜</button>
</div>

<script>
    const tarotData = [
        { n: "0 愚者", m: "新的冒險與開始，保持純真與勇氣。" },
        { n: "I 魔術師", m: "展現才華，萬事具備，發揮創意。" },
        { n: "II 女祭司", m: "直覺敏銳，內在智慧，靜觀其變。" },
        { n: "III 皇后", m: "生活富足豐盛，感受愛與美。" },
        { n: "IV 皇帝", m: "權威穩定，建立秩序與掌控。" },
        { n: "V 教皇", m: "尋求指引，遵循傳統智慧與規範。" },
        { n: "VI 戀人", m: "美好的選擇，情感的和諧聯繫。" },
        { n: "VII 戰車", m: "意志堅定，克服障礙邁向勝利。" },
        { n: "VIII 力量", m: "溫柔的力量能戰勝內心的恐懼。" },
        { n: "IX 隱士", m: "退回內心，尋找自我的真理。" },
        { n: "X 命運之輪", m: "時來運轉，新的契機即將出現。" },
        { n: "XI 正義", m: "公平誠實，做出理性的決定。" },
        { n: "XII 倒吊人", m: "換個角度思考，現在需要等待。" },
        { n: "XIII 死亡", m: "舊的結束，即將迎來新的蛻變。" },
        { n: "XIV 節制", m: "尋求平衡，融合不同的可能性。" },
        { n: "XV 魔鬼", m: "覺察慾望，打破自我束縛的枷鎖。" },
        { n: "XVI 高塔", m: "震撼的改變，摧毀後的重生。" },
        { n: "XVII 星星", m: "希望不滅，平靜與心靈的療癒。" },
        { n: "XVIII 月亮", m: "探索不安，潛意識的夢境指引。" },
        { n: "XIX 太陽", m: "光明燦爛，充滿喜悅與活力。" },
        { n: "XX 審判", m: "覺醒的時刻，做出關鍵的召喚。" },
        { n: "XXI 世界", m: "圓滿達成，生命旅程的里程碑。" }
    ];

    const suits = ["權杖", "聖杯", "寶劍", "錢幣"];
    suits.forEach(s => {
        for(let i=1; i<=10; i++) tarotData.push({n: s+i, m: "象徵"+s+"能量的階段性展現。"});
        ["侍者", "騎士", "皇后", "國王"].forEach(p => tarotData.push({n: s+p, m: "代表"+s+"特質的人物或行動。"}));
    });

    const posConfig = {
        "1": ["神聖指引"],
        "3": ["過去", "現在", "未來"],
        "4": ["思考", "行動", "情感", "現實"],
        "6": ["現狀", "環境", "阻礙", "建議", "他人", "結果"],
        "7": ["週一", "週二", "週三", "週四", "週五", "週六", "週日"]
    };

    let pickGoal = 0;
    let pickedNum = 0;
    let pool = [];

    function handleShuffle() {
        pickGoal = parseInt(document.getElementById('spreadType').value);
        document.getElementById('setup-view').style.display = 'none';
        
        const deck = document.getElementById('deck-display');
        deck.innerHTML = '';
        document.getElementById('game-view').style.display = 'block';

        // 生成 78 張
        for(let i=0; i<78; i++) {
            const c = document.createElement('div');
            c.className = 'tarot-card';
            c.innerText = 'TAROT';
            deck.appendChild(c);
        }

        document.getElementById('status-text').innerText = "請抽牌";
        document.getElementById('need-count').innerText = pickGoal;
        initGame();
    }

    function initGame() {
        pool = [...tarotData].sort(() => Math.random() - 0.5);
        const cards = document.querySelectorAll('.tarot-card');
        cards.forEach((el, idx) => {
            el.onclick = () => {
                if(pickedNum < pickGoal && !el.classList.contains('selected')) {
                    el.classList.add('selected');
                    renderResult(pool[idx]);
                    pickedNum++;
                    document.getElementById('need-count').innerText = pickGoal - pickedNum;
                    
                    if(pickedNum === pickGoal) {
                        document.getElementById('game-view').style.display = 'none';
                        document.getElementById('status-text').innerText = "啟示已顯現";
                        document.getElementById('footer-action').style.display = 'block';
                    }
                }
            };
        });
    }

    function renderResult(data) {
        const res = document.getElementById('result-display');
        const div = document.createElement('div');
        div.className = 'result-item';
        const label = posConfig[pickGoal][pickedNum];
        div.innerHTML = `<span class="pos-name">${label}</span><span class="card-title">${data.n}</span><p class="card-desc">${data.m}</p>`;
        res.appendChild(div);
    }
</script>
</body>
</html>
